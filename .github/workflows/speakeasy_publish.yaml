name: Speakeasy Publish
on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
    secrets:
      github_access_token:
        required: true
      SPEAKEASY_API_KEY:
        required: true
      OSSRH_USERNAME:
        required: true
      OSSRH_PASSWORD:
        required: true
      JAVA_GPG_SECRET_KEY:
        required: true
      JAVA_GPG_PASSPHRASE:
        required: true
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: sdk-automation
    runs-on: ubuntu-22.04
    outputs:
      java_regenerated: ${{ steps.release.outputs.java_regenerated }}
      publish_java: ${{ steps.release.outputs.publish_java }}
      java_directory: ${{ steps.release.outputs.java_directory }}
      java_language_version: ${{ steps.release.outputs.java_language_version }}
      use_sonatype_legacy: ${{ steps.release.outputs.use_sonatype_legacy }}
    steps:
      - name: Verify environment credentials
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
        run: |
          for name in SPEAKEASY_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required environment secret ${name} is missing. See SDK_CREDENTIALS.md."
              exit 1
            fi
          done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: prepare
        uses: ./.github/actions/prepare-speakeasy
      - id: release
        uses: ./.speakeasy/temp/action
        with:
          action: release
          target: ${{ inputs.target }}
          github_access_token: ${{ secrets.github_access_token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          enable_sdk_changelog: "true"
      - name: Log Release Result
        if: always() && steps.prepare.outcome == 'success'
        uses: ./.speakeasy/temp/action
        with:
          action: log-result
          github_access_token: ${{ secrets.github_access_token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          GH_ACTION_VERSION: ${{ github.sha }}
          GH_ACTION_STEP: ${{ github.job }}
          TARGET_TYPE: sdk
  publish-java:
    environment: sdk-publish
    if: github.ref == 'refs/heads/main' && needs.release.outputs.java_regenerated == 'true' && needs.release.outputs.publish_java == 'true'
    runs-on: ubuntu-22.04
    needs: release
    defaults:
      run:
        working-directory: ${{ needs.release.outputs.java_directory }}
    steps:
      - name: Verify environment credentials
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          JAVA_GPG_SECRET_KEY: ${{ secrets.JAVA_GPG_SECRET_KEY }}
          JAVA_GPG_PASSPHRASE: ${{ secrets.JAVA_GPG_PASSPHRASE }}
        run: |
          for name in SPEAKEASY_API_KEY OSSRH_USERNAME OSSRH_PASSWORD JAVA_GPG_SECRET_KEY JAVA_GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required environment secret ${name} is missing. See SDK_CREDENTIALS.md."
              exit 1
            fi
          done
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - id: prepare
        uses: ./.github/actions/prepare-speakeasy
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: corretto
          java-version: ${{ needs.release.outputs.java_language_version || '11' }}
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: "8.14"
      - name: Publish to Sonatype (legacy)
        if: needs.release.outputs.use_sonatype_legacy == 'true'
        run: |-
          pwd
          ./gradlew publish --no-daemon
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.JAVA_GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPassphrase: ${{ secrets.JAVA_GPG_PASSPHRASE }}
      - name: Publish to Sonatype Central
        if: needs.release.outputs.use_sonatype_legacy != 'true'
        run: |-
          pwd
          ./gradlew build sonatypeCentralUpload --no-daemon
        env:
          SONATYPE_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SONATYPE_SIGNING_KEY: ${{ secrets.JAVA_GPG_SECRET_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.JAVA_GPG_PASSPHRASE }}
      - name: Record Publish Event
        if: always() && steps.prepare.outcome == 'success'
        uses: ./.speakeasy/temp/action
        with:
          action: publish-event
          github_access_token: ${{ secrets.github_access_token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
          target_directory: ${{ needs.release.outputs.java_directory }}
          registry_name: sonatype
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          GH_ACTION_VERSION: ${{ github.sha }}
      - name: Log Publish Result
        if: always() && steps.prepare.outcome == 'success'
        uses: ./.speakeasy/temp/action
        with:
          action: log-result
          github_access_token: ${{ secrets.github_access_token }}
          speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
        env:
          GH_ACTION_RESULT: ${{ job.status }}
          GH_ACTION_VERSION: ${{ github.sha }}
          GH_ACTION_STEP: ${{ github.job }}
          TARGET_TYPE: sdk
